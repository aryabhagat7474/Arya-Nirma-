<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giove – Smart Topic Explainer & Learning Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--sh:#f8fafc;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--p:#4f46e5;--pl:#eef2ff;--ok:#10b981;--bad:#f43f5e;--am:#f59e0b;--code:#0f172a;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#020617;--sh:#0b1120;--c:#111a2e;--t:#f1f5f9;--m:#94a3b8;--b:#1e293b;--pl:#1e1b4b}}
:root[data-theme=dark]{--bg:#020617;--sh:#0b1120;--c:#111a2e;--t:#f1f5f9;--m:#94a3b8;--b:#1e293b;--pl:#1e1b4b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font:13px/1.5 Inter,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',Inter,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.shell{width:100%;max-width:430px;height:100%;max-height:900px;background:var(--sh);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:431px){.shell{border-radius:40px;border:9px solid #1e293b;box-shadow:0 30px 60px -15px #0006;height:880px}}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b);background:var(--c)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#818cf8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{display:flex;border-top:1px solid var(--b);background:var(--c);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--m);font-size:10px;font-weight:600}
nav button i{font-style:normal;font-size:19px}nav button.on{color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;box-shadow:0 2px 8px -2px #0000000d;animation:up .3s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.hero{background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;border:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pl);color:var(--p);text-transform:uppercase;letter-spacing:.04em}
.btn{padding:7px 12px;border-radius:12px;font-weight:600;font-size:12px;background:var(--pl);color:var(--p);transition:.15s}
.btn:active{transform:scale(.95)}.btn.pr{background:var(--p);color:#fff}.btn.dg{background:#fee2e2;color:#be123c}
.btn[disabled]{opacity:.5;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chip{white-space:nowrap;padding:6px 12px;border-radius:12px;font-weight:600;font-size:12px;background:var(--c);border:1px solid var(--b);color:var(--m)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.m{color:var(--m)}.s{font-size:11px}.b{font-weight:700}
pre{background:var(--code);color:#6ee7b7;border-radius:12px;padding:10px;font:11px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto;margin:8px 0}
.bar{height:6px;border-radius:9px;background:var(--b);overflow:hidden}.bar>div{height:100%;background:var(--p);border-radius:9px;transition:width .5s}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--b);background:var(--sh);color:var(--t);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 3px #6366f133}
.opt{width:100%;text-align:left;padding:9px 11px;border-radius:12px;border:1px solid var(--b);background:var(--c);font-weight:500;margin-top:6px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.fc{perspective:900px;height:150px;cursor:pointer}.fi{position:relative;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff}
.ff{background:linear-gradient(135deg,#4f46e5,#4338ca)}.fb{background:#0f172a;transform:rotateY(180deg);border:1px solid #334155}
.qd{padding:10px;border-radius:12px;cursor:pointer;border:1px solid var(--b)}.qd:active{transform:scale(.97)}
#toast{position:absolute;top:70px;left:50%;transform:translate(-50%,-90px);background:#0f172a;color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:12px;transition:.3s;z-index:60;opacity:0;white-space:nowrap;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#sheet{position:absolute;inset:0;background:#0f172a66;backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end}
#sheet.on{display:flex}#sheet>div{background:var(--c);width:100%;border-radius:24px 24px 0 0;padding:18px;max-height:85%;overflow:auto;animation:up .3s}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tl{position:relative;padding-left:26px}.tl:before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--b)}
.nd{position:absolute;left:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--b);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--m);border:3px solid var(--c)}
.nd.d{background:var(--ok);color:#fff}.nd.a{background:var(--p);color:#fff}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="row" style="gap:10px;cursor:pointer" onclick="profile()">
    <div class="av" id="av">AN</div>
    <div><div class="row" style="justify-content:flex-start;gap:6px"><b id="nm" style="font-family:'Plus Jakarta Sans'"></b><span class="pill" id="lv"></span></div>
    <div class="m s" id="lvl"></div></div>
  </div>
  <div class="row">
    <button class="btn" style="background:#fef3c7;color:#b45309" onclick="go('stats')">🔥 <span id="st"></span></button>
    <button class="btn" onclick="notifs()" style="position:relative">🔔<span id="dot" class="dot" style="position:absolute;top:4px;right:4px"></span></button>
  </div>
</header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sc"></div></div>
</div>
<script>
/* ---------- DATA ---------- */
const KB={
closures:{n:'Closures',tag:'JavaScript',mod:0,
 b:'A closure is a function that remembers the variables of the scope where it was created, even after that scope has finished running.',
 e:'A function carries a little backpack with the variables it needs wherever it goes.',
 a:'Like a chef who memorised a recipe at home and can still cook it perfectly in another kitchen.',
 d:'Every function keeps a reference to its lexical environment. Variables live as long as any closure references them, which enables private state, factories and memoisation, but a forgotten reference can leak memory. Classic bug: var in a loop shares one binding, while let creates a fresh one per iteration.',
 code:'function counter(){\n  let n = 0;\n  return () => ++n;\n}\nconst c = counter();\nc(); c(); // 2',
 q:['What does a closure remember?',['Only global variables','Variables from its creation scope','Nothing after it returns'],1]},
promises:{n:'Promises vs Async/Await',tag:'Async JS',mod:1,
 b:'Async/await is syntax sugar over Promises. It turns pyramids of .then() callbacks into clear top-to-bottom code with normal try/catch.',
 e:'A promise is an IOU for a value that will arrive later. await means "wait here until the IOU is paid".',
 a:'Ordering food: the buzzer is the promise, and await is standing at the counter until it rings.',
 d:'A Promise is pending, then fulfilled or rejected. An async function always returns a promise; await pauses only that function, not the thread. Use Promise.all for parallel work and always handle rejections, otherwise you get unhandled rejection errors.',
 code:'async function load(){\n  try {\n    const u = await fetchUser();\n    console.log(u.name);\n  } catch (e) { console.error(e); }\n}',
 q:['An async function always returns…',['A Promise','undefined','A callback'],0]},
loop:{n:'The Event Loop',tag:'Async JS',mod:1,
 b:'JavaScript runs one thing at a time. The event loop moves finished async tasks from queues onto the call stack when it is empty.',
 e:'One cashier serves one customer at a time, and a line of waiting customers forms behind them.',
 a:'A restaurant kitchen with one chef: orders queue up, and the chef takes the next only when free.',
 d:'Order: call stack, then microtasks (promise callbacks), then one macrotask (setTimeout, I/O), repeat. Microtasks drain fully before the next macrotask, which is why a promise callback runs before setTimeout(fn,0).',
 code:'setTimeout(()=>log(1),0);\nPromise.resolve().then(()=>log(2));\nlog(3);\n// 3, 2, 1',
 q:['Which runs first?',['setTimeout callback','Promise .then callback','They run together'],1]},
delegation:{n:'Event Delegation',tag:'DOM',mod:0,
 b:'Attach one listener to a parent and handle clicks from many children using event bubbling. It saves memory and works for elements added later.',
 e:'Instead of giving every kid a phone, you give the teacher one phone that everyone calls.',
 a:'A receptionist who routes all calls, instead of each employee having a personal line.',
 d:'Events bubble from target to ancestors. Use event.target with closest() to identify the real element. It cuts listener count from n to 1 and handles dynamic lists. Avoid it for events that do not bubble (focus, blur).',
 code:'list.addEventListener("click", e => {\n  const li = e.target.closest("li");\n  if (li) select(li);\n});',
 q:['Event delegation relies on…',['Event bubbling','Event capturing only','setTimeout'],0]},
flex:{n:'CSS Grid Centering',tag:'CSS',mod:2,
 b:'Modern CSS centers on both axes with two lines. No more margin maths or absolute positioning hacks.',
 e:'Put the box in a room where the rule is "everything sits in the middle".',
 a:'Like a picture frame mat that automatically keeps the photo centered.',
 d:'place-items is shorthand for align-items and justify-items. Grid centers a single child neatly; with flexbox use justify-content plus align-items. Use min-height so the container has room to center within.',
 code:'.box{\n  display: grid;\n  place-items: center;\n  min-height: 100vh;\n}',
 q:['Which centers a child in both axes?',['display:grid; place-items:center','float:center','text-align:middle'],0]},
rest:{n:'REST APIs',tag:'Backend',mod:2,
 b:'REST maps HTTP verbs to actions on resources: GET reads, POST creates, PUT/PATCH updates, DELETE removes, using clear URLs like /users/42.',
 e:'A menu at a restaurant: fixed dishes (resources) and standard ways to order, change or cancel.',
 a:'A library catalogue system: same rules to find, borrow, renew or return any book.',
 d:'REST is stateless: each request has all context needed. Good APIs use nouns in URLs, correct status codes (200, 201, 404, 422), pagination, idempotent PUT/DELETE and versioning. Cache GETs safely with ETag and Cache-Control.',
 code:'GET    /users/42\nPOST   /users\nPATCH  /users/42\nDELETE /users/42',
 q:['Which verb usually creates a resource?',['GET','POST','DELETE'],1]},
hooks:{n:'React Hooks',tag:'React',mod:2,
 b:'Hooks let function components use state and lifecycle features. useState stores data, useEffect runs side effects after render.',
 e:'Hooks are attachable power tools for a plain function.',
 a:'A basic drill becomes a full workshop when you snap on new attachments.',
 d:'Call hooks only at the top level and only in components or custom hooks, because React tracks them by call order. useEffect dependencies control re-runs, and cleanup functions prevent leaks. Extract reusable logic into custom hooks such as useFetch.',
 code:'const [n, setN] = useState(0);\nuseEffect(() => {\n  document.title = `Count ${n}`;\n}, [n]);',
 q:['useEffect runs…',['Before render','After render','Only on unmount'],1]}
};
const KEYS=Object.keys(KB);
const MODS=[['JavaScript Fundamentals','Scopes, closures, DOM events'],['Asynchronous Mastery','Promises, async/await, event loop'],['Web & React Architecture','CSS, REST, Hooks']];
const EMP={says:['SAYS','I want quick, simple explanations tailored to my level.','Smart Explainer with 4 depth modes and level-aware feed text.'],thinks:['THINKS','Is this relevant to my goals?','Every topic sits in a roadmap module linked to your goal.'],does:['DOES','Skips generic info, scans summaries.','Skip button removes cards and Tune Algorithm reorders the feed.'],feels:['FEELS','Overloaded by info, motivated by progress.','XP, streaks, badges and progress bars give instant feedback.'],pains:['PAIN POINTS','Generic content, hidden weak spots.','Wrong quiz answers become weak areas with a Fix Now shortcut.'],gains:['GAINS','Time saved, better retention.','Flashcards with mastery tracking and text-to-speech.']};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toDateString();

/* ---------- STATE (persisted) ---------- */
const DEF={name:'Arya Nirman',level:'Intermediate',goal:20,xp:1450,streak:14,last:'',day:today(),act:[15,25,18,30,22,12,0],done:[],skip:[],bm:[],quiz:{},explored:[],recent:[],seed:1,depth:'b',dark:null,
 cards:[{f:'What is Event Delegation in the DOM?',b:'One listener on a parent handles events from children via bubbling. Saves memory.',m:80},{f:'What does Array.map() return?',b:'A brand new array of transformed elements. The original is unchanged.',m:40}]};
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('giove')||'{}'))}catch(e){S=structuredClone(DEF)}
let TOK=localStorage.getItem('gtok')||'',SRV=false,sv;
async function api(m,u,b){const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOK},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
const save=()=>{try{localStorage.setItem('giove',JSON.stringify(S))}catch(e){}if(TOK&&SRV){clearTimeout(sv);sv=setTimeout(()=>api('PUT','state',{state:S}).catch(()=>{}),500)}};
let tab='feed',filt='all',ex=null,deckI=0,open=-1,speaking=false;

/* ---------- HELPERS ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function rollDay(){const t=today();if(S.day!==t){const gap=Math.min(7,Math.max(1,Math.round((new Date(t)-new Date(S.day))/864e5)));for(let i=0;i<gap;i++){S.act.shift();S.act.push(0)}S.day=t}}
function add(xp,min=2){rollDay();S.xp+=xp;S.act[6]+=min;const t=today();if(S.last!==t){const y=new Date(Date.now()-864e5).toDateString();S.streak=(S.last===y||S.last==='')?S.streak+1:1;if(S.last!=='')toast('🔥 Streak: '+S.streak+' days!');S.last=t}save();head()}
const lvl=()=>Math.floor(S.xp/500)+1;
const prog=m=>{const k=KEYS.filter(x=>KB[x].mod===m);return Math.round(100*k.filter(x=>S.done.includes('c'+x)).length/k.length)};
const weak=()=>KEYS.filter(k=>S.quiz[k]==='wrong');
function go(t){tab=t;render();$('#v').scrollTop=0}
function txt(k){const o=KB[k];return S.level==='Beginner'?o.e:S.level==='Advanced'?o.d:o.b}
function applyTheme(){const r=document.documentElement;if(S.dark===null)r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.dark?'dark':'light')}

/* ---------- HEADER / NAV ---------- */
function head(){$('#nm').textContent=S.name;$('#av').textContent=S.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();$('#lv').textContent=S.level;$('#lvl').textContent='🎯 Full-Stack Mastery · Lv '+lvl()+' · '+S.xp.toLocaleString()+' XP';$('#st').textContent=S.streak;$('#dot').style.display=notifList().length?'':'none'}
function nav(){$('#nav').innerHTML=[['feed','📚','Feed'],['explain','✨','Explainer'],['road','🧭','Roadmap'],['stats','📈','Stats'],['empathy','💗','Empathy']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}

/* ---------- FEED ---------- */
function order(){let l=[];KEYS.forEach(k=>{l.push({id:'c'+k,k,t:'c'});l.push({id:'q'+k,k,t:'q'})});
 let s=S.seed;const r=()=>(s=(s*9301+49297)%233280)/233280;l.sort((a,b)=>r()-.5);
 const w=weak();l.sort((a,b)=>(w.includes(b.k)-w.includes(a.k))||(S.done.includes(a.id)-S.done.includes(b.id)));return l}
function feed(){
 const l=order().filter(c=>!S.skip.includes(c.id)&&(filt==='all'||(filt==='c'&&c.t==='c')||(filt==='q'&&c.t==='q')||(filt==='bm'&&S.bm.includes(c.id))||(filt==='todo'&&!S.done.includes(c.id))));
 const mins=Math.max(2,l.filter(c=>!S.done.includes(c.id)).length*2),today_=S.act[6],pct=Math.min(100,Math.round(100*today_/S.goal));
 return `<div class="card hero"><div class="row"><div><div class="s b" style="opacity:.7;letter-spacing:.08em">ADAPTIVE FEED</div><h2>Daily Bite-Sized Feed</h2></div><span class="pill" style="background:#fff3;color:#fff">${S.level}</span></div>
 <p class="s" style="opacity:.85;margin:6px 0 10px">Explanations matched to your level, with weak areas first.</p>
 <div class="bar" style="background:#fff3"><div style="width:${pct}%;background:#fff"></div></div>
 <div class="row s" style="margin-top:6px;opacity:.9"><span>Today ${today_}/${S.goal} min</span><span>~${mins} min left in feed</span><button class="b" style="color:#fff;text-decoration:underline" onclick="S.seed++;save();toast('Feed re-tuned to your progress');render()">Tune Algorithm</button></div></div>
 <div class="chips">${[['all','⚡ All'],['todo','📝 To do'],['c','💡 Concepts'],['q','🎯 Quick Check'],['bm','🔖 Saved']].map(x=>`<button class="chip ${filt===x[0]?'on':''}" onclick="filt='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`
 +(l.map(c=>c.t==='c'?cCard(c):qCard(c)).join('')||`<div class="card m" style="text-align:center">Nothing here yet 🎉<br><button class="btn" style="margin-top:8px" onclick="filt='all';render()">Show all</button></div>`)
 +(S.skip.length?`<button class="btn" onclick="S.skip=[];save();render()">Restore ${S.skip.length} skipped card(s)</button>`:'')}
function cCard(c){const o=KB[c.k],d=S.done.includes(c.id),bm=S.bm.includes(c.id);
 return `<div class="card" style="${d?'opacity:.65':''}"><div class="row"><div class="row" style="gap:6px"><span class="pill">Concept · 2 min</span><span class="m s">${o.tag}</span></div><button onclick="bmk('${c.id}')" style="font-size:16px;filter:${bm?'none':'grayscale(1) opacity(.4)'}">🔖</button></div>
 <h3 style="font-size:14px;margin:8px 0 4px">${o.n}</h3><p class="m">${txt(c.k)}</p><pre>${esc(o.code)}</pre>
 <div class="row"><div class="row" style="gap:6px"><button class="btn pr" ${d?'disabled':''} onclick="gotIt('${c.id}')">${d?'✓ Done':'Got It (+25 XP)'}</button><button class="btn" onclick="skip('${c.id}')">Skip</button></div><button class="btn" onclick="explainK('${c.k}')">Deeper ›</button></div></div>`}
function qCard(c){const o=KB[c.k],[q,opts,a]=o.q,r=S.quiz[c.k];
 return `<div class="card" style="background:linear-gradient(135deg,#fffbeb,#fff7ed);color:#0f172a;border-color:#fde68a"><div class="row"><span class="pill" style="background:var(--am);color:#fff">🎯 Recall check · ${o.tag}</span><b class="s" style="color:#b45309">+50 XP</b></div>
 <h3 style="font-size:14px;margin:8px 0">${q}</h3>${opts.map((t,i)=>`<button class="opt ${r?(i===a?'ok':''):''}" style="${r?'pointer-events:none':''}" onclick="ans('${c.k}',${i})">${'ABC'[i]}) ${t}</button>`).join('')}
 ${r?`<p class="s b" style="margin-top:8px;color:${r==='right'?'#059669':'#be123c'}">${r==='right'?'Correct! ✓':'Not quite. '}<a style="color:#4f46e5;cursor:pointer" onclick="explainK('${c.k}')">Review ${o.n} ›</a></p><button class="s" style="color:#92400e;text-decoration:underline;margin-top:4px" onclick="delete S.quiz['${c.k}'];save();render()">Retry</button>`:''}</div>`}
function gotIt(id){if(S.done.includes(id))return;S.done.push(id);add(25);toast('Mastered! +25 XP ⚡');render()}
function skip(id){S.skip.push(id);save();toast('Skipping this. Feed tuned.');render()}
function bmk(id){const i=S.bm.indexOf(id);i<0?(S.bm.push(id),toast('Saved to your collection 🔖')):S.bm.splice(i,1);save();render()}
function ans(k,i){if(S.quiz[k])return;const ok=i===KB[k].q[2];S.quiz[k]=ok?'right':'wrong';if(ok){add(50);toast('Correct! +50 XP ✅')}else{save();toast('Not quite. Check the review link')}render()}

/* ---------- EXPLAINER ---------- */
function find(q){q=q.toLowerCase();return KEYS.find(k=>k.includes(q)||KB[k].n.toLowerCase().includes(q)||q.includes(k)||q.split(/\W+/).some(w=>w.length>3&&(KB[k].n.toLowerCase().includes(w)||KB[k].tag.toLowerCase()===w)))}
function explain(){
 const dp=[['b','⚡ Bite-size'],['e','🧒 ELI5'],['a','💡 Analogy'],['d','📚 Deep']];
 let h=`<div class="card"><div class="row"><h2 style="font-size:15px">✨ Smart Topic Explainer</h2><span class="pill">Offline</span></div>
 <p class="m s" style="margin:4px 0 10px">Ask any topic. Get an explanation at your level.</p>
 <div class="row"><input id="ti" placeholder="e.g. closures, REST, hooks…" onkeydown="if(event.key==='Enter')gen()"><button class="btn pr" style="padding:11px 14px" onclick="gen()">→</button></div>
 <div class="s b m" style="margin:10px 0 4px">FORMAT</div><div class="g" style="grid-template-columns:repeat(4,1fr);gap:5px">${dp.map(d=>`<button class="chip ${S.depth===d[0]?'on':''}" style="padding:6px 2px;text-align:center" onclick="S.depth='${d[0]}';save();ex?gen(ex.q):render()">${d[1]}</button>`).join('')}</div>
 <div class="chips" style="margin-top:8px">${(S.recent.length?S.recent:KEYS.map(k=>KB[k].n)).slice(0,7).map(r=>`<button class="chip" onclick="gen('${esc(r).replace(/'/g,'')}')">${esc(r)}</button>`).join('')}</div></div>`;
 if(ex){const o=ex.k?KB[ex.k]:null,body=ex.k?o[S.depth==='a'?'a':S.depth]:ex.g[S.depth];
  h+=`<div class="card" style="border-color:var(--p)"><div class="row" style="padding-bottom:8px;border-bottom:1px solid var(--b)"><span class="pill">Topic: ${esc(ex.n)}</span><div class="row" style="gap:6px"><button class="btn" onclick="speak()">${speaking?'⏹':'🔊'}</button><button class="btn" onclick="saveCard()">＋ Card</button></div></div>
  <p id="et" style="margin:10px 0">${esc(body)}</p>${o?`<pre>${esc(o.code)}</pre>`:''}
  <div style="background:#fffbeb;color:#78350f;border:1px solid #fde68a;border-radius:12px;padding:10px"><b>💡 Real-world analogy</b><br>${esc(ex.k?o.a:ex.g.a)}</div>
  <div class="row s" style="margin-top:10px"><span class="m">${ex.k?'Part of: '+MODS[o.mod][0]:'Not in roadmap yet'}</span><button class="b" style="color:var(--p)" onclick="filt='all';go('feed')">Related cards ›</button></div></div>`}
 const dk=S.cards;
 h+=`<div class="card"><div class="row"><b class="s m" style="letter-spacing:.06em">ACTIVE RECALL (${dk.length})</b><span class="s b" style="color:var(--p)">Tap card to flip</span></div>`
 +(dk.length?(()=>{deckI=Math.min(deckI,dk.length-1);const c=dk[deckI];return `<div class="fc" style="margin:10px 0" id="fc" onclick="this.classList.toggle('f')"><div class="fi"><div class="ff"><span class="s b" style="opacity:.8">${deckI+1} / ${dk.length}</span><h4 style="text-align:center;font-size:14px">${esc(c.f)}</h4><span class="s" style="text-align:center;opacity:.7">Tap to show answer</span></div><div class="fb"><span class="s b" style="color:#34d399">ANSWER</span><p class="s" style="color:#cbd5e1">${esc(c.b)}</p><span class="s" style="opacity:.6;text-align:right">Mastery ${c.m}%</span></div></div></div>
 <div class="row"><button class="btn" onclick="nc(-1)">‹</button><button class="btn dg" onclick="rate(-20)">↺ Again</button><button class="btn pr" onclick="rate(20)">✓ Know it</button><button class="btn" onclick="delCard()">🗑</button><button class="btn" onclick="nc(1)">›</button></div>`})():`<p class="m" style="margin-top:8px">No cards yet. Explain a topic and tap ＋ Card.</p>`)+`</div>`;
 return h}
function gen(q){q=(q||($('#ti')&&$('#ti').value)||'').trim();if(!q){toast('Enter a topic first');return}
 const k=find(q),n=k?KB[k].n:q;
 ex={q,k,n,g:{b:`${n} is a core idea worth learning step by step: start with what problem it solves, then try a tiny example yourself.`,e:`Imagine ${n} as a helpful rule that keeps things tidy so you can build bigger things without mess.`,a:`${n} is like a good recipe: follow the same steps and you get reliable results every time.`,d:`To master ${n}: define it precisely, learn its main parts, write a minimal example, then break it on purpose to see edge cases. Compare it with a related concept to sharpen the differences.`}};
 S.recent=[n,...S.recent.filter(x=>x!==n)].slice(0,6);
 if(!S.explored.includes(n)){S.explored.push(n);add(10,1);toast('+10 XP for exploring a new topic')}else save();
 window.speechSynthesis&&speechSynthesis.cancel();speaking=false;tab='explain';render();const i=$('#ti');if(i)i.value=q}
function explainK(k){ex=null;tab='explain';gen(KB[k].n)}
function speak(){if(!('speechSynthesis' in window)){toast('Speech not supported here');return}
 if(speaking){speechSynthesis.cancel();speaking=false;return render()}
 const u=new SpeechSynthesisUtterance($('#et').innerText);u.onend=()=>{speaking=false;render()};speaking=true;speechSynthesis.speak(u);render()}
function saveCard(){if(!ex)return;const f='What is '+ex.n+'?',b=ex.k?KB[ex.k].b:ex.g.b;if(S.cards.some(c=>c.f===f)){toast('Already in your deck');return}S.cards.push({f,b,m:0});deckI=S.cards.length-1;add(5,0);toast('Saved as recall card ✅');render()}
function nc(d){deckI=(deckI+d+S.cards.length)%S.cards.length;render()}
function rate(d){const c=S.cards[deckI];c.m=Math.max(0,Math.min(100,c.m+d));if(d>0)add(5,1);save();toast(d>0?'Mastery '+c.m+'%':'We\'ll show it again');nc(1)}
function delCard(){S.cards.splice(deckI,1);deckI=0;save();render()}

/* ---------- ROADMAP ---------- */
function road(){const P=MODS.map((_,i)=>prog(i)),ph=P.filter(p=>p===100).length+1;
 return `<div class="card"><div class="row"><div><h2 style="font-size:15px">Learning Roadmap</h2><span class="m s">Sequence toward your career goal</span></div><span class="pill" style="background:#d1fae5;color:#047857">Phase ${Math.min(ph,3)} / 3</span></div>
 <div class="tl" style="margin-top:16px;display:grid;gap:16px">${MODS.map((m,i)=>{const locked=i>0&&P[i-1]<50,st=P[i]===100?'d':locked?'':'a';
 return `<div style="position:relative;${locked?'opacity:.55':''}"><span class="nd ${st}">${P[i]===100?'✓':locked?'🔒':i+1}</span><div class="qd" onclick="${locked?"toast('Finish 50% of the previous module to unlock')":`open=open===${i}?-1:${i};render()`}"><div class="row"><b>Module ${i+1}: ${m[0]}</b><b class="s" style="color:var(--p)">${P[i]}%</b></div><div class="m s" style="margin:2px 0 6px">${m[1]}</div><div class="bar"><div style="width:${P[i]}%"></div></div>
 ${open===i&&!locked?`<div style="margin-top:8px">${KEYS.filter(k=>KB[k].mod===i).map(k=>`<div class="row" style="padding:5px 0"><span>${S.done.includes('c'+k)?'✅':'⬜'} ${KB[k].n}</span><button class="btn" onclick="event.stopPropagation();explainK('${k}')">Study</button></div>`).join('')}</div>`:''}</div></div>`}).join('')}</div></div>
 <div class="card"><b class="s m" style="letter-spacing:.06em">DIAGNOSED WEAK AREAS</b>${weak().map(k=>`<div class="row" style="margin-top:8px;padding:10px;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;color:#0f172a"><div><b>${KB[k].n}</b><div class="s" style="color:#be123c">Missed in quick check</div></div><button class="btn dg" onclick="explainK('${k}')">Fix Now</button></div>`).join('')||`<p class="m" style="margin-top:6px">No weak areas 🎉 Answer Quick Checks in the Feed to get diagnosed.</p>`}</div>`}

/* ---------- STATS ---------- */
function badges(){const dn=S.done.length;return [['🏆','10-Day Streak',S.streak>=10,S.streak+'/10'],['🚀','Fast Learner',S.xp>=1500,Math.min(100,Math.round(S.xp/15))+'%'],['🧠','Recall Rookie',S.cards.length>=3,S.cards.length+'/3 cards'],['🎯','Sharp Mind',Object.values(S.quiz).includes('right'),'1 quiz'],['📚','Card Collector',dn>=5,dn+'/5'],['👑','JS Master',KEYS.every(k=>S.done.includes('c'+k)),dn+'/'+KEYS.length]]}
function stats(){const avg=Math.round(S.act.reduce((a,b)=>a+b,0)/7),into=S.xp%500;
 return `<div class="g g2"><div class="card"><span class="m s b">Learning XP</span><h2 style="font-size:22px">${S.xp.toLocaleString()}</h2><span class="s b" style="color:var(--ok)">Level ${lvl()}</span><div class="bar" style="margin-top:6px"><div style="width:${into/5}%"></div></div></div>
 <div class="card"><span class="m s b">Time Saved</span><h2 style="font-size:22px">${(S.done.length*.4+3.8).toFixed(1)} hrs</h2><span class="s b" style="color:var(--p)">Via bite-sized cards</span></div></div>
 <div class="card"><div class="row"><div><h3 style="font-size:14px">Weekly Activity</h3><span class="m s">Minutes per day</span></div><span class="pill">Avg ${avg}m/day</span></div><canvas id="ch" style="width:100%;height:130px;margin-top:8px"></canvas></div>
 <button class="btn pr" style="padding:11px" onclick="board()">🏅 Leaderboard</button><div class="card"><b class="s m" style="letter-spacing:.06em">BADGES</b><div class="g g3" style="margin-top:8px;text-align:center">${badges().map(b=>`<div class="qd" style="${b[2]?'':'opacity:.5'}"><div style="font-size:24px">${b[2]?b[0]:'🔒'}</div><b class="s">${b[1]}</b><div class="m" style="font-size:9px">${b[2]?'Unlocked':b[3]}</div></div>`).join('')}</div></div>`}
function chart(){const c=$('#ch');if(!c)return;const d=devicePixelRatio||1,w=c.offsetWidth,h=c.offsetHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
 const cs=getComputedStyle(document.documentElement),bar=cs.getPropertyValue('--b'),mu=cs.getPropertyValue('--m'),v=S.act,mx=Math.max(35,...v),bw=24,g=(w-bw*7)/8,dn=['M','T','W','T','F','S','S'],rr=(a,b,cw,ch)=>{x.beginPath();x.roundRect?x.roundRect(a,b,cw,ch,6):x.rect(a,b,cw,ch);x.fill()};
 v.forEach((n,i)=>{const px=g+i*(bw+g),bh=n/mx*(h-30);x.fillStyle=bar;rr(px,8,bw,h-28,6);x.fillStyle=i===6?'#4f46e5':'#818cf8';rr(px,h-20-bh,bw,Math.max(bh,2),6);x.fillStyle=mu;x.font='600 10px Inter,sans-serif';x.textAlign='center';x.fillText(i===6?'Today':dn[(new Date(Date.now()-(6-i)*864e5).getDay()+6)%7],px+bw/2,h-5)})}

/* ---------- EMPATHY ---------- */
function empathy(){const col={says:'#dbeafe',thinks:'#d1fae5',does:'#fef3c7',feels:'#f3e8ff',pains:'#ffe4e6',gains:'#ccfbf1'},ic={says:'💬',thinks:'🧠',does:'⚡',feels:'❤️',pains:'⚠️',gains:'🎯'};
 return `<div class="card"><div class="row"><div><h2 style="font-size:15px">Learner Empathy Map</h2><span class="m s">Research findings and UX rationale</span></div><span class="pill">User centric</span></div><p class="m s" style="margin:8px 0">Tap a quadrant to see how a feature solves that need.</p>
 <div class="g g2">${Object.keys(EMP).map(k=>`<div class="qd" style="background:${col[k]};color:#0f172a;${window.eq===k?'outline:2px solid #4f46e5':''}" onclick="eq='${k}';render()"><b style="font-size:10px">${ic[k]} ${EMP[k][0]}</b><div class="s">${EMP[k][1]}</div></div>`).join('')}</div>
 <div style="margin-top:10px;background:#0f172a;color:#fff;padding:12px;border-radius:12px"><b style="color:#a5b4fc;display:block;margin-bottom:3px">${window.eq?'Design response: '+EMP[eq][0]:'System design implication'}</b><span class="s" style="color:#cbd5e1">${window.eq?EMP[eq][2]:'Pick any quadrant to see the feature that answers it.'}</span></div></div>`}

/* ---------- SHEETS ---------- */
const sheet=h=>{$('#sc').innerHTML=h;$('#sheet').classList.add('on')};function closeSheet(){$('#sheet').classList.remove('on')}
function notifList(){const n=[];rollDay();if(S.act[6]<S.goal)n.push(['🎯',`${S.goal-S.act[6]} min left to hit today's goal.`]);weak().forEach(k=>n.push(['⚠️','Review weak area: '+KB[k].n]));const t=KEYS.filter(k=>!S.done.includes('c'+k)).length;if(t)n.push(['📚',t+' concept cards waiting in your feed.']);if(S.last!==today())n.push(['🔥','Learn something today to extend your streak.']);return n}
function notifs(){const n=notifList();sheet(`<div class="row"><h3>Notifications</h3><button onclick="closeSheet()">✕</button></div><div style="margin-top:10px;display:grid;gap:8px">${n.map(x=>`<div class="qd">${x[0]} ${x[1]}</div>`).join('')||'<p class="m">No unread alerts. You are up to date! 🎉</p>'}</div>`)}
function profile(){sheet(`<div class="row"><h3>Learner Preferences</h3><button onclick="closeSheet()">✕</button></div><div style="display:grid;gap:12px;margin-top:12px">
 <div><b class="s">Name</b><input id="pn" value="${esc(S.name)}" maxlength="24"></div>
 <div><b class="s">Skill level</b><select id="pl">${['Beginner','Intermediate','Advanced'].map(l=>`<option ${l===S.level?'selected':''}>${l}</option>`).join('')}</select></div>
 <div><b class="s">Daily goal</b><div class="g g3" style="margin-top:4px">${[10,20,30].map(m=>`<button class="chip ${S.goal===m?'on':''}" style="text-align:center" onclick="S.goal=${m};save();profile()">${m} min</button>`).join('')}</div></div>
 <div class="row"><b class="s">Theme</b><div class="row" style="gap:6px">${[[null,'Auto'],[false,'☀️ Light'],[true,'🌙 Dark']].map(t=>`<button class="chip ${S.dark===t[0]?'on':''}" onclick="S.dark=${t[0]};applyTheme();save();profile()">${t[1]}</button>`).join('')}</div></div>
 <button class="btn pr" style="padding:11px" onclick="S.name=$('#pn').value.trim()||S.name;S.level=$('#pl').value;save();closeSheet();head();render();toast('Preferences saved ✅')">Save Settings</button>
 ${acct()}<button class="btn dg" onclick="if(confirm('Reset all progress?')){S=structuredClone(DEF);save();applyTheme();closeSheet();ex=null;head();render();toast('Progress reset')}">Reset progress</button></div>`)}

/* ---------- ROUTER ---------- */
function render(){const y=$('#v').scrollTop;$('#v').innerHTML={feed,explain,road,stats,empathy}[tab]();nav();head();if(tab==='stats')chart();$('#v').scrollTop=y}
addEventListener('resize',()=>tab==='stats'&&chart());

function acct(){return TOK?`<div class="row"><span class="s m">Signed in as <b>${esc(localStorage.getItem('guser')||'')}</b></span><button class="btn" onclick="logout()">Log out</button></div>`:SRV?`<button class="btn" onclick="closeSheet();authUI()">Log in / Register to sync</button>`:'<p class="s m">Guest mode: run server.js for accounts and cloud sync.</p>'}
function logout(){api('POST','logout').catch(()=>{});TOK='';localStorage.removeItem('gtok');S=structuredClone(DEF);ex=null;closeSheet();applyTheme();render();authUI()}
async function board(){try{const r=await api('GET','leaderboard');sheet(`<div class="row"><h3>🏅 Leaderboard</h3><button onclick="closeSheet()">✕</button></div><div style="margin-top:10px;display:grid;gap:8px">${r.top.map((u,i)=>`<div class="qd row" style="${u.name===S.name?'border-color:var(--p);background:var(--pl)':''}"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} <b>${esc(u.name)}</b></span><span class="s m">${u.xp.toLocaleString()} XP · 🔥${u.streak}</span></div>`).join('')||'<p class="m">No learners yet.</p>'}</div>`)}catch(e){sheet(`<div class="row"><h3>🏅 Leaderboard</h3><button onclick="closeSheet()">✕</button></div><p class="m" style="margin-top:10px">Start the server (node server.js) to compete with other learners.</p>`)}}
function authUI(m='login'){let a=$('#auth');if(!a){a=document.createElement('div');a.id='auth';a.style.cssText='position:absolute;inset:0;z-index:70;background:var(--sh);padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px';$('.shell').appendChild(a)}
a.innerHTML=`<div style="text-align:center"><div style="font-size:44px">🎓</div><h1 style="font-size:24px">Giove</h1><p class="m s">${m==='login'?'Welcome back! Log in to sync your progress.':'Create your learner account'}</p></div>${m==='reg'?'<input id="au_n" placeholder="Full name">':''}<input id="au_u" placeholder="Username" autocapitalize="off"><input id="au_p" type="password" placeholder="Password (min 6 chars)" onkeydown="if(event.key===\'Enter\')authGo(\'${m}\')"><div id="au_e" class="s" style="color:var(--bad);min-height:16px"></div><button class="btn pr" style="padding:12px" onclick="authGo('${m}')">${m==='login'?'Log in':'Create account'}</button><button class="btn" onclick="authUI('${m==='login'?'reg':'login'}')">${m==='login'?'New here? Register':'Have an account? Log in'}</button><button class="s m" onclick="$('#auth').remove()">Continue as guest (saved on this device)</button>`}
async function authGo(m){const u=$('#au_u').value.trim().toLowerCase(),p=$('#au_p').value,n=m==='reg'?$('#au_n').value.trim():'';try{const r=await api('POST',m==='reg'?'register':'login',{username:u,password:p,name:n});TOK=r.token;localStorage.setItem('gtok',TOK);localStorage.setItem('guser',u);S=Object.assign(structuredClone(DEF),r.state);rollDay();applyTheme();save();$('#auth').remove();render();toast('Welcome, '+S.name+'! 🎉')}catch(e){$('#au_e').textContent=e.message}}
async function boot(){rollDay();applyTheme();render();try{await api('GET','health');SRV=true}catch(e){SRV=false}
 if(!SRV)return;if(TOK){try{const r=await api('GET','state');S=Object.assign(structuredClone(DEF),r.state);rollDay();applyTheme();render();return}catch(e){TOK='';localStorage.removeItem('gtok')}}authUI()}
boot();
</script>
</body>
</html>
